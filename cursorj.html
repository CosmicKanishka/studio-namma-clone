<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Document</title>
  </head>
  <style>
    #cursor {
      background-color: blue;
      position: fixed;
      height: 20px;
      width: 20px;
      border-radius: 50%;
      left: -20px;
      top: -20px;
      /* pointer-events: none; */
      z-index: 501;
      transition: 0.05s ease-in-out;
    }
    .content.first {
      height: 100vh;
      background-color: rgb(59, 87, 59);
      /* z-index: 500; */
    }
    .content.second {
      height: 100vh;
      background-color: burlywood;
      position: relative;
      z-index: 500;
    }
    #videoCursor {
      position: fixed;
      height: 100px;
      width: 100px;
      /* border-radius: 50 */
      left: 0px;
      top: 0px;
      /* pointer-events: none; */
      z-index: 499;
      transition: 0.05s ease-in-out;
    }
    #videoCursor>video {
      height: 250px;
      width: 150px;
    }
  </style>
  <body>
    <div id="cursor"></div>
    <div id="videoCursor">
      <video
        autoplay=""
        loop=""
        style="
          background-image: url(&quot;https://cdn.prod.website-files.com/679cb9cacf00799ba4b4c985%2F68dfa5030619737bde7460e5_Home-Hero-DK%20ModeV4-poster-00001.jpg&quot;);
        "
        muted=""
        playsinline=""
        data-wf-ignore="true"
        data-object-fit="cover"
      >
        <source
          src="https://cdn.prod.website-files.com/679cb9cacf00799ba4b4c985%2F68dfa5030619737bde7460e5_Home-Hero-DK%20ModeV4-transcode.mp4"
          data-wf-ignore="true"
        />
      </video>
    </div>

    <section class="content first"></section>
    <section class="content second"></section>
  </body>
  <script>
    let cursor = document.getElementById("cursor");
    let videoCursor = document.getElementById("videoCursor");

    let contents = document.querySelectorAll(".content");
    contents.forEach((content, index) => {
      content.addEventListener("mousemove", (event) => {
        if (index == 0) {
          videoCursor.style.left = event.clientX +20+ "px";
          videoCursor.style.top = event.clientY + 20+"px";
          videoCursor.style.display = "block";
          cursor.style.display = "none";
        } else {
          cursor.style.left = event.clientX + 20 + "px"; //it will also work .
          cursor.style.top = `${event.clientY + 20}px`;
          videoCursor.style.display = "none";
          cursor.style.display = "block";
        }
      });
    });
  </script>
</html>
